<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2d1566">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>怨氣俱樂部 GRUDGE CLUB</title>
<style>
:root{
  --p0:#1b0b3d;--p1:#2d1566;--p2:#4a2392;--blue:#2f8bff;--blue-d:#1457c4;
  --or:#ff8a1f;--or-d:#c4570a;--gold:#f4d9a0;--gold-d:#b98d3e;--cream:#fff6e4;--ink:#1b0b3d;
  --font:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--p0);color:var(--cream);font-family:var(--font);
  overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;touch-action:none}
button,input{font-family:inherit}
#cv{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;background:var(--p0)}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;display:none;flex-direction:column;overflow-y:auto;touch-action:pan-y;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);
  background:linear-gradient(180deg,rgba(27,11,61,.94),rgba(45,21,102,.96))}
.screen.on{display:flex}
.screen.home{background:none;pointer-events:none;overflow:hidden}
.screen.home .menu,.screen.home .topbar{pointer-events:auto}
.hdr{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hdr h2{margin:0;font-size:22px;font-weight:900;color:var(--gold)}
.back{border:0;border-radius:14px;background:rgba(255,255,255,.12);color:var(--cream);font-size:16px;font-weight:800;padding:10px 14px;min-height:44px}
.topbar{display:flex;justify-content:space-between;gap:8px}
.chip{background:rgba(27,11,61,.7);border:2px solid rgba(244,217,160,.55);border-radius:999px;padding:6px 14px;font-weight:800;font-size:15px;color:var(--gold);max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- logo ---------- */
.brand{margin-top:clamp(8px,3vh,28px);text-align:center;transition:margin .6s ease}
.brand .logo,.brand .sub{display:block;width:fit-content;margin-left:auto;margin-right:auto}
.brand .logo{transition:font-size .6s ease,transform .6s ease,text-shadow .6s ease}
.brand .sub{transition:opacity .5s ease,max-height .6s ease,margin .6s ease,padding .6s ease;max-height:60px;overflow:hidden}
.brand.en .logo{font-size:clamp(36px,12vw,60px);letter-spacing:1px}
.brand.mini{margin-top:2px}
.brand.mini .logo,.brand.mini.en .logo{font-size:22px;transform:rotate(0);letter-spacing:1px;text-shadow:0 2px 0 #c96108,0 4px 8px rgba(10,3,30,.5)}
.brand.mini .sub{opacity:0;max-height:0;margin-top:0;padding-top:0;padding-bottom:0}
button.chip{font-family:inherit;cursor:pointer;min-height:40px}
.logo{display:inline-block;font-weight:900;font-size:clamp(46px,16vw,78px);line-height:1.05;color:#ffb03a;transform:rotate(-3deg);
  text-shadow:0 1px 0 #ff9a1f,0 2px 0 #f58510,0 3px 0 #e0730a,0 4px 0 #c96108,0 5px 0 #ae5006,0 6px 0 #924105,0 7px 0 #703104,
    0 14px 16px rgba(10,3,30,.55),0 0 30px rgba(255,138,31,.45)}
.sub{display:inline-block;margin-top:14px;padding:5px 16px;border-radius:999px;background:linear-gradient(180deg,var(--gold),#d9b46a);color:var(--ink);
  font-weight:900;font-size:13px;letter-spacing:1px;box-shadow:0 3px 0 var(--gold-d)}
.spacer{flex:1}
.menu{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:26px;background:rgba(27,11,61,.62);
  border:2px solid rgba(244,217,160,.28);backdrop-filter:blur(4px)}
.rankcard{display:flex;flex-direction:column;gap:6px}
.rk-top{display:flex;justify-content:space-between;align-items:baseline}
.rk-name{font-weight:900;font-size:18px;color:var(--gold)}
.rk-xp{font-size:13px;opacity:.85}
.bar{height:12px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--blue),#7fd0ff);transition:width .5s}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:12px;color:#ffd2a1;text-align:center;min-height:0}

/* ---------- 3D buttons ---------- */
.btn{border:0;color:#fff;font-weight:900;font-size:18px;border-radius:18px;min-height:54px;padding:10px 16px;cursor:pointer;
  text-shadow:0 2px 0 rgba(0,0,0,.25);transition:transform .06s,box-shadow .06s}
.btn.big{font-size:26px;min-height:68px;border-radius:22px}
.btn.or{background:linear-gradient(180deg,#ffb04a,var(--or));box-shadow:0 6px 0 var(--or-d),0 10px 18px rgba(0,0,0,.35)}
.btn.bl{background:linear-gradient(180deg,#5aa6ff,var(--blue));box-shadow:0 6px 0 var(--blue-d),0 10px 18px rgba(0,0,0,.3)}
.btn.pu{background:linear-gradient(180deg,#7a47d6,#5a2bb0);box-shadow:0 6px 0 #34196f,0 10px 18px rgba(0,0,0,.3)}
.btn.gd{background:linear-gradient(180deg,#fbe7bd,var(--gold));color:var(--ink);text-shadow:none;box-shadow:0 6px 0 var(--gold-d),0 10px 18px rgba(0,0,0,.3)}
.btn:active{transform:translateY(4px)}
.btn.or:active{box-shadow:0 2px 0 var(--or-d)}
.btn.bl:active{box-shadow:0 2px 0 var(--blue-d)}
.btn.pu:active{box-shadow:0 2px 0 #34196f}
.btn.gd:active{box-shadow:0 2px 0 var(--gold-d)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.small{font-size:15px;min-height:44px;padding:8px 12px;border-radius:14px}

/* ---------- forms / cards ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:800;color:var(--gold);font-size:15px}
.field input{width:100%;font-size:18px;padding:13px 14px;border-radius:14px;border:2px solid rgba(244,217,160,.45);background:rgba(255,255,255,.1);color:var(--cream);outline:none;
  -webkit-user-select:text;user-select:text}
.field input:focus{border-color:var(--blue);background:rgba(47,139,255,.14)}
.hint{font-size:12.5px;opacity:.8;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cp{border:2px solid rgba(244,217,160,.4);background:rgba(255,255,255,.08);color:var(--cream);font-weight:800;font-size:14px;padding:9px 13px;border-radius:999px;min-height:42px}
.cp.sel{background:var(--or);border-color:#ffd59a;color:#fff}
.card{background:rgba(255,255,255,.08);border:2px solid rgba(244,217,160,.22);border-radius:20px;padding:12px 14px;margin-bottom:10px}
.lv{display:flex;gap:12px;align-items:center;width:100%;text-align:left;color:var(--cream);font-size:inherit}
.lv .em{font-size:34px;width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;flex:none}
.lv .tx{flex:1;min-width:0}
.lv .nm{font-weight:900;font-size:17px}
.lv .rl{font-size:12.5px;opacity:.82;line-height:1.4;margin-top:2px}
.lv .stars{font-size:15px;letter-spacing:1px;white-space:nowrap;text-align:right}
.lv.lock{opacity:.5}
.lv.today{border-color:var(--or)}
.sec{font-weight:900;color:var(--gold);margin:14px 0 8px;font-size:16px}
.grid3{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.item{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:12px 8px;border-radius:18px;background:rgba(255,255,255,.08);border:2px solid rgba(244,217,160,.2)}
.item .em{font-size:36px}
.item .nm{font-weight:900}
.item .ds{font-size:12px;opacity:.8}
.item.lock .em{filter:grayscale(1);opacity:.5}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tg{width:58px;height:32px;border-radius:99px;border:0;background:rgba(255,255,255,.2);position:relative;flex:none}
.tg::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .15s}
.tg.on{background:var(--blue)}
.tg.on::after{left:29px}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;display:none;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 8px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
#hud.on{display:block}
#hud>*{pointer-events:none}
#hud button{pointer-events:auto}
.hrow{display:flex;align-items:center;gap:8px}
.pill{background:rgba(27,11,61,.74);border:2px solid rgba(244,217,160,.5);border-radius:16px;padding:5px 12px}
.rbtn{width:44px;height:44px;border-radius:50%;border:2px solid rgba(244,217,160,.6);background:rgba(27,11,61,.78);color:var(--cream);font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center}
#tm{font-size:24px;font-weight:900;color:#fff;min-width:78px;text-align:center}
#tm.low{color:#ffb04a}
.hscore{margin-top:8px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
#sc{font-size:34px;font-weight:900;color:var(--gold);line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.4)}
.vs{font-size:12px;opacity:.9;margin-top:3px;max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cmbw{text-align:right;min-width:90px}
#cmb{font-size:30px;font-weight:900;color:var(--or);text-shadow:0 3px 0 rgba(0,0,0,.45);display:inline-block}
#cmb.pop{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(1.6)}100%{transform:scale(1)}}
#cmbl{font-size:12px;opacity:.85}
.goal{margin-top:8px;display:flex;align-items:center;gap:8px;font-size:12px}
.gbar{position:relative;flex:1;height:14px;border-radius:99px;background:rgba(255,255,255,.18);overflow:visible}
.gbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--or),#ffd27a);width:0}
.gbar b{position:absolute;top:-6px;font-size:13px;transform:translateX(-50%);filter:grayscale(1);opacity:.7}
.gbar b.got{filter:none;opacity:1}
#wd{font-weight:800;color:#9fd2ff;white-space:nowrap}
.hbot{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;justify-content:space-between;align-items:flex-end}
#propb{width:62px;height:62px;border-radius:50%;font-size:30px;border:3px solid var(--gold);background:rgba(27,11,61,.8);color:#fff}
#ammo{font-size:18px;font-weight:900}
.tip{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);text-align:center;font-weight:800;font-size:15px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.7);opacity:.95}

/* ---------- modals ---------- */
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(15,5,40,.62);z-index:20}
.modal.on{display:flex}
.mcard{width:100%;max-width:380px;max-height:100%;overflow-y:auto;border-radius:26px;padding:20px;text-align:center;
  background:linear-gradient(180deg,#43208a,#2a1260);border:3px solid var(--gold);box-shadow:0 14px 40px rgba(0,0,0,.5);touch-action:pan-y}
.mcard h3{margin:0 0 6px;font-size:24px;font-weight:900;color:var(--gold)}
.mcard p{margin:6px 0;line-height:1.55;font-size:15px}
.mcard .btn{width:100%;margin-top:10px}
.big-stars{font-size:44px;letter-spacing:6px;margin:6px 0}
.rscore{font-size:54px;font-weight:900;color:#fff;text-shadow:0 4px 0 var(--or-d);line-height:1.1}
.lines{display:flex;flex-direction:column;gap:4px;margin:10px 0;font-size:14px;text-align:left}
.lines div{display:flex;justify-content:space-between;border-bottom:1px dashed rgba(255,255,255,.18);padding:3px 0}
.reward{display:flex;gap:10px;justify-content:center;margin:8px 0;font-weight:900}
.reward span{background:rgba(255,255,255,.12);border-radius:99px;padding:6px 14px}
.banner{background:linear-gradient(90deg,var(--or),#ffc15e);color:#fff;font-weight:900;border-radius:14px;padding:8px;margin:8px 0}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%);z-index:50;background:rgba(27,11,61,.94);color:var(--cream);
  border:2px solid var(--gold);padding:10px 18px;border-radius:999px;font-weight:800;font-size:14px;display:none;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:reduce){#cmb.pop{animation:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<!-- 首頁 -->
<div id="home" class="screen home on">
  <div class="topbar"><div class="chip" id="hName">匿名玩家</div><div style="flex:1"></div><button class="chip" id="bLang" aria-label="Language">EN</button><div class="chip" id="hCoin">🪙 0</div></div>
  <div class="brand" id="brand"><div class="logo" id="logo">怨氣俱樂部</div><div class="sub" id="logoSub">GRUDGE CLUB</div></div>
  <div class="spacer"></div>
  <div class="menu">
    <div class="rankcard">
      <div class="rk-top"><div class="rk-name" id="hRank">忍耐實習生</div><div class="rk-xp" id="hXp"></div></div>
      <div class="bar"><i id="hXpFill"></i></div>
    </div>
    <button class="btn or big" id="bStart">開始遊戲</button>
    <div class="grid2">
      <button class="btn bl" id="bChar">自訂角色</button>
      <button class="btn bl" id="bLevels">關卡挑戰</button>
      <button class="btn pu" id="bColl">我的收藏</button>
      <button class="btn pu" id="bSet">設定</button>
    </div>
    <div class="note" id="hWarn"></div>
  </div>
</div>

<!-- 自訂角色 -->
<div id="setup" class="screen">
  <div class="hdr"><button class="back" data-go="home">← 返回</button><h2>自訂角色</h2></div>
  <div class="field"><label for="iName">你的暱稱</label>
    <input id="iName" maxlength="10" placeholder="匿名玩家" autocomplete="off"></div>
  <div class="field"><label for="iOpp">虛構對手稱號</label>
    <input id="iOpp" maxlength="12" placeholder="留空＝使用關卡預設對手" autocomplete="off">
    <div class="chips" id="oppChips"></div>
    <div class="hint">請使用虛構稱號（例如「暴躁主管」）。名稱只存在這支手機的瀏覽器，不會上傳或公開。</div></div>
  <div class="field"><label>遊戲模式</label><div class="chips" id="modeChips"></div></div>
  <div class="field"><label>初始道具</label><div class="chips" id="propChips"></div></div>
  <button class="btn or" id="bSetupGo">儲存並開始</button>
</div>

<!-- 關卡 -->
<div id="levels" class="screen">
  <div class="hdr"><button class="back" data-go="home">← 返回</button><h2>關卡挑戰</h2></div>
  <div id="lvList"></div>
</div>

<!-- 收藏 -->
<div id="coll" class="screen">
  <div class="hdr"><button class="back" data-go="home">← 返回</button><h2>我的收藏</h2></div>
  <div class="chip" id="cCoin" style="align-self:flex-start;margin-bottom:6px">🪙 0</div>
  <div class="sec" id="secA">個人最佳紀錄</div><div class="card" id="cStats"></div>
  <div class="sec" id="secB">道具</div><div class="grid3" id="cProps"></div>
  <div class="sec" id="secC">對手徽章（通關解鎖）</div><div class="grid3" id="cBadges"></div>
</div>

<!-- 設定 -->
<div id="settings" class="screen">
  <div class="hdr"><button class="back" data-go="home">← 返回</button><h2>設定</h2></div>
  <div class="card row"><span id="sSound">音效</span><button class="tg" id="tgSound"></button></div>
  <div class="card row"><span id="sVib">震動回饋</span><button class="tg" id="tgVib"></button></div>
  <div class="card row"><span id="sCalm">減少特效（較少震動與光暈）</span><button class="tg" id="tgCalm"></button></div>
  <div class="card"><div class="row"><span id="sReset">清除所有遊戲資料</span><button class="btn pu small" id="bReset">清除</button></div>
    <div class="hint" id="resetHint">只會清除這支手機瀏覽器中的紀錄。</div></div>
  <div class="card hint" id="sAbout"></div>
</div>

<!-- HUD -->
<div id="hud">
  <div class="hrow">
    <button class="rbtn" id="bPause" aria-label="暫停">⏸</button>
    <button class="rbtn" id="bRestart" aria-label="重新開始">↻</button>
    <div style="flex:1"></div>
    <div class="pill"><span id="tm">0</span></div>
  </div>
  <div class="hscore">
    <div><div id="sc">0</div><div class="vs" id="vs"></div></div>
    <div id="cmbw"><span id="cmb">0</span><div id="cmbl">連擊</div></div>
  </div>
  <div class="goal"><span id="gLbl">目標</span><div class="gbar"><i id="gf"></i><b id="s1">⭐</b><b id="s2">⭐</b><b id="s3">⭐</b></div><span id="wd"></span></div>
  <div class="tip" id="tip"></div>
  <div class="hbot">
    <button id="propb" aria-label="換道具">📄</button>
    <div class="pill"><span id="ammo">道具 0</span></div>
  </div>
</div>

<!-- 開場 -->
<div id="intro" class="modal"><div class="mcard">
  <div style="font-size:54px" id="inEm">😤</div>
  <h3 id="inName"></h3>
  <p id="inRule"></p>
  <p style="color:var(--gold);font-weight:800" id="inGoal"></p>
  <p class="hint" id="inHow">手指往下拉再放開，布偶就會被丟中！<br>拉越遠越用力，畫面會顯示落點。直接點布偶可以拍拍它。</p>
  <button class="btn or big" id="bGo">開始！</button>
  <button class="btn pu small" id="bInBack">返回</button>
</div></div>

<!-- 暫停 -->
<div id="pause" class="modal"><div class="mcard">
  <h3 id="pTitle">暫停中</h3>
  <button class="btn or" id="bResume">繼續</button>
  <button class="btn bl" id="bPRestart">重新開始</button>
  <button class="btn pu" id="bPHome">回首頁</button>
</div></div>

<!-- 結算 -->
<div id="result" class="modal"><div class="mcard">
  <h3 id="rTitle">挑戰結束</h3>
  <div class="big-stars" id="rStars"></div>
  <div class="rscore" id="rScore">0</div>
  <div id="rBest" class="banner" style="display:none">新紀錄！</div>
  <div class="lines" id="rLines"></div>
  <div class="reward"><span id="rCoin">🪙 +0</span><span id="rXp">經驗 +0</span></div>
  <div id="rBonus" class="hint"></div>
  <div class="rk-top"><div class="rk-name" id="rRank"></div><div class="rk-xp" id="rXpT"></div></div>
  <div class="bar"><i id="rFill"></i></div>
  <div id="rUp" class="banner" style="display:none"></div>
  <button class="btn or" id="bAgain">再玩一次</button>
  <button class="btn bl" id="bNext" style="display:none">下一關</button>
  <button class="btn gd small" id="bShare">分享成績</button>
  <button class="btn gd small" id="bAd" disabled>看廣告 雙倍遊戲幣（未來版本）</button>
  <button class="btn pu small" id="bRHome">回首頁</button>
</div></div>

<div id="toast"></div>

<script>
(() => {
'use strict';
/* =====================================================================
   工具
===================================================================== */
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const lerp = (a,b,t) => a+(b-a)*t;
const rand = (a,b) => a+Math.random()*(b-a);
const TAU = Math.PI*2;
const cv = $('#cv'), ctx = cv.getContext('2d');

/* =====================================================================
   資料定義
===================================================================== */
const RANKS = [
  {n:'忍耐實習生',xp:0},{n:'反擊新人',xp:200},{n:'情緒高手',xp:600},{n:'怨氣大師',xp:1400},{n:'傳說解壓王',xp:3000}
];
const PROPS = [
  {id:'paper', n:'紙團',     e:'📄', price:0,   r:14, hit:1.0,  mult:1.0, flight:.55, d:'輕巧快速'},

let AC=null;
function audio(){
  if(!S.settings.sound) return null;
  try{
    if(!AC){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; AC=new C(); }
    if(AC.state==='suspended') AC.resume();
    return AC;
  }catch(e){ return null; }
}
function tone(f,dur,type,vol,slide,delay){
  const a=audio(); if(!a) return;
  try{
    const t0=a.currentTime+(delay||0), o=a.createOscillator(), g=a.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t0);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide,t0+dur);
    g.gain.setValueAtTime(vol||.12,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0+dur+.03);
  }catch(e){}
}
function noise(dur,vol,hp){
  const a=audio(); if(!a) return;
  try{
    const n=Math.floor(a.sampleRate*dur), buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
    const src=a.createBufferSource(); src.buffer=buf; const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp||1200;
    const g=a.createGain(); g.gain.value=vol; src.connect(f); f.connect(g); g.connect(a.destination); src.start();
  }catch(e){}
}

let W=360,H=640,DPR=1,U=120,SX=180,SY=550,BG=null;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  W=Math.max(200,window.innerWidth); H=Math.max(300,window.innerHeight);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  U=Math.min(W*.36,H*.19); SX=W/2; SY=H*.86;
  buildBG();
}
function rr(c,x,y,w,h,r){
  r=Math.min(r,w/2,h/2); c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
function buildBG(){
  BG=document.createElement('canvas'); BG.width=Math.round(W*DPR); BG.height=Math.round(H*DPR);
  const c=BG.getContext('2d'); c.setTransform(DPR,0,0,DPR,0,0);
  const hz=H*.55;
  // 牆面
  let g=c.createLinearGradient(0,0,0,hz); g.addColorStop(0,'#1f0e4a'); g.addColorStop(.6,'#3a1a82'); g.addColorStop(1,'#5a2bb0');
  c.fillStyle=g; c.fillRect(0,0,W,hz);
  for(let i=0;i<7;i++){ c.fillStyle=i%2?'rgba(255,255,255,.035)':'rgba(0,0,0,.06)'; c.fillRect(i*W/7,0,W/7,hz); }
  c.strokeStyle='rgba(47,139,255,.25)'; c.lineWidth=2;
  for(let i=1;i<7;i++){ c.beginPath(); c.moveTo(i*W/7,0); c.lineTo(i*W/7,hz); c.stroke(); }
  // 霓虹橫條
  c.save(); c.shadowColor='#2f8bff'; c.shadowBlur=14; c.strokeStyle='#5aa6ff'; c.lineWidth=4;
  c.beginPath(); c.moveTo(0,hz*.2); c.lineTo(W,hz*.2); c.stroke();
  c.shadowColor='#ff8a1f'; c.strokeStyle='#ffab4d'; c.beginPath(); c.moveTo(0,hz*.86); c.lineTo(W,hz*.86); c.stroke(); c.restore();
  // 舞台光環
  const cx=W/2, cy=H*.42;
  g=c.createRadialGradient(cx,cy,U*.2,cx,cy,U*1.9); g.addColorStop(0,'rgba(244,217,160,.38)'); g.addColorStop(1,'rgba(244,217,160,0)');
  c.fillStyle=g; c.fillRect(0,0,W,hz+H*.1);
  c.save(); c.shadowColor='#2f8bff'; c.shadowBlur=18; c.strokeStyle='#4aa0ff'; c.lineWidth=7;
  c.beginPath(); c.arc(cx,cy,U*1.45,0,TAU); c.stroke();
  c.shadowColor='#ff8a1f'; c.strokeStyle='#ffa43a'; c.lineWidth=3; c.beginPath(); c.arc(cx,cy,U*1.6,0,TAU); c.stroke(); c.restore();
  // 兩側街機台
  function cab(left){
    const w=W*.2, x0=left?0:W-w, dir=left?1:-1;
    c.save();
    c.beginPath(); c.moveTo(x0,H*.12); c.lineTo(x0+dir*w,H*.17); c.lineTo(x0+dir*w,hz+H*.06); c.lineTo(x0,hz+H*.12); c.closePath();
    const gg=c.createLinearGradient(x0,0,x0+dir*w,0); gg.addColorStop(0,'#2a1264'); gg.addColorStop(1,'#43208a');
    c.fillStyle=gg; c.fill(); c.strokeStyle='#4aa0ff'; c.lineWidth=3; c.shadowColor='#2f8bff'; c.shadowBlur=10; c.stroke(); c.shadowBlur=0;
    const sx=left?w*.2:W-w*.8, sw=w*.6;
    const sg=c.createLinearGradient(0,H*.22,0,H*.4); sg.addColorStop(0,left?'#ffb04a':'#5aa6ff'); sg.addColorStop(1,left?'#d9581a':'#2f56d9');
    c.fillStyle=sg; rr(c,sx,H*.22,sw,H*.17,8); c.fill();
    c.fillStyle='rgba(255,255,255,.28)'; rr(c,sx+4,H*.22+4,sw-8,H*.04,6); c.fill();
    c.fillStyle='#ffd27a'; for(let i=0;i<3;i++){ c.beginPath(); c.arc(sx+sw*(.2+.3*i),H*.47,5,0,TAU); c.fill(); }
    c.restore();
  }
  cab(true); cab(false);
  // 地板
  g=c.createLinearGradient(0,hz,0,H); g.addColorStop(0,'#4a2399'); g.addColorStop(.5,'#2b1360'); g.addColorStop(1,'#170a35');
  c.fillStyle=g; c.fillRect(0,hz,W,H-hz);
  c.save(); c.beginPath(); c.rect(0,hz,W,H-hz); c.clip();
  c.strokeStyle='rgba(74,160,255,.55)'; c.lineWidth=1.6; c.shadowColor='#2f8bff'; c.shadowBlur=6;
  for(let i=-14;i<=14;i++){ c.beginPath(); c.moveTo(W/2+i*W*.03,hz); c.lineTo(W/2+i*W*.26,H); c.stroke(); }
  for(let k=1;k<=9;k++){ const y=hz+(H-hz)*Math.pow(k/9,2); c.beginPath(); c.moveTo(0,y); c.lineTo(W,y); c.stroke(); }
  c.restore();
  c.save(); c.strokeStyle='#ffab4d'; c.lineWidth=3; c.shadowColor='#ff8a1f'; c.shadowBlur=12;
  c.beginPath(); c.moveTo(0,hz); c.lineTo(W,hz); c.stroke(); c.restore();
  // 輕微暗角
  g=c.createRadialGradient(W/2,H*.48,Math.min(W,H)*.35,W/2,H*.5,Math.max(W,H)*.75);
  g.addColorStop(0,'rgba(10,3,30,0)'); g.addColorStop(1,'rgba(10,3,30,.38)');
  c.fillStyle=g; c.fillRect(0,0,W,H);
}

function endGame(){
  if(!G || G.state==='end') return;
  G.state='end'; ptr=null; G.ctrs=[]; G.ctrPending=0;
  const isPunch=G.mode==='punch';
  const acc = G.throws? G.hits/G.throws : 0;
  const accB = isPunch?0:Math.round(acc*100)*2, comboB=G.maxCombo*10;
  const total = G.score+accB+comboB;
  const k = total/G.cfg.goal;
  const stars = k>=STAR_X[2]?3:k>=STAR_X[1]?2:k>=STAR_X[0]?1:0;
  const win = stars>0;
  let coins = win ? Math.floor(total/25)+stars*15 : Math.floor(total/50);
  let xp = win ? Math.floor(total/10)+stars*25 : Math.floor(total/20);
  const oldXp=S.xp, oldRank=rankIdx(S.xp);
  let bonus='';
  // 紀錄
  const bkey = G.mode==='level' ? 'L'+G.lv : G.mode==='daily' ? 'D' : 'P';
  const prev = S.best[bkey]||{score:0,stars:0};
  const newBest = total>prev.score;
  if(newBest || stars>prev.stars) S.best[bkey]={score:Math.max(prev.score,total),stars:Math.max(prev.stars,stars)};
  S.stats.hits+=G.hits; S.stats.throws+=G.throws; S.stats.plays++; S.stats.bestCombo=Math.max(S.stats.bestCombo,G.maxCombo);
  if(G.mode==='level' && win){
    if(!S.badges.includes(G.lv)) S.badges.push(G.lv);
    S.unlocked=Math.max(S.unlocked,Math.min(LEVELS.length,G.lv+2));
  }
  if(G.mode==='daily'){
    ensureDaily(); S.daily.best=Math.max(S.daily.best,total);

  }
  S.coins+=coins; S.xp+=xp; save();
  const newRank=rankIdx(S.xp);
  G.res={total,stars,win,acc,accB,comboB,coins,xp,oldXp,newBest,bonus,rankUp:newRank>oldRank?newRank:-1};
  (win?SFX.win:SFX.lose)();

}

function rankIdxPct(xp){ const i=rankIdx(xp), a=RANKS[i], b=RANKS[i+1]; return b? clamp((xp-a.xp)/(b.xp-a.xp)*100,0,100):100; }
function countUp(el,v){

===================================================================== */
const K_REACH = 3.4;
function windPx(){ return G&&G.cfg.wind ? G.cfg.wind*Math.sin(time*.6+G.wph)*W*.12 : 0; }
function plan(dx,dy){
  const L=H*.2; let len=Math.hypot(dx,dy);
  if(len>L){ dx*=L/len; dy*=L/len; len=L; }
  const pow=len/L;
  return {A:{x:SX-dx*K_REACH+windPx(), y:SY-dy*K_REACH}, pow, ok: len>H*.035 && dy>0, dx, dy};
}
function ballPos(pl,t){
  const arc=H*(.05+.08*pl.pow);
  return {x:lerp(SX,pl.A.x,t), y:lerp(SY,pl.A.y,t)-Math.sin(Math.PI*t)*arc};
}
function ballR(prop,t){ return prop.r*(U/120)*lerp(1.4,.55,t); }
function throwBall(pl){
  if(!G||G.state!=='play'||G.ammo<=0||G.cool>0||!pl.ok) return false;
  const pr=G.prop;
  G.ammo--; G.throws++; G.cool=.22;
  const T=pr.flight*(1.1-.35*pl.pow)*(G.cfg.mult>1.4&&G.cfg.size<.9?.85:1);
  G.balls.push({state:'fly',t:0,T,pl,prop:pr,x:SX,y:SY,spin:0,vs:rand(-9,9),life:0});
  SFX.throw(); vib(8); updHUD(); return true;
}

function addText(x,y,s,color,size){ texts.push({x,y,s,color:color||'#fff',size:size||22,life:.9,max:.9}); }
function burst(x,y,n,strength){
  if(S.settings.calm) n=Math.ceil(n*.5);
  const cols=['#ffb04a','#2f8bff','#f4d9a0','#ff6fa8','#ffffff','#9b6bff'];
  for(let i=0;i<n && parts.length<260;i++){
    const a=rand(0,TAU), sp=rand(80,320)*strength;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-120,life:rand(.5,1),max:1,type:['star','conf','dot'][i%3],
      color:cols[(Math.random()*cols.length)|0],size:rand(5,11),rot:rand(0,TAU),vr:rand(-9,9)});
  }
}
function impact(t,x,y,str,part){
  t.sx=1+.26*str; t.sy=1-.24*str; t.sxV=0; t.syV=0;
  t.rotV+=((x-t.x)/(U*t.size))*-3.2*str+rand(-1,1)*str;
  t.hopV=-230*(U/120)*str; t.kxV+=(t.x-x>0?1:-1)*140*str; t.hurt=.55;
  const s=U*t.size;
  t.dents.push({x:(x-(t.x+t.kx))/s, y:(y-(t.y+t.hop+.9*s))/s+.9, life:.7});
  if(t.dents.length>6) t.dents.shift();
  fxl.push({x,y,life:.28,max:.28,s:str});
  if(!S.settings.calm) shakeAmt=Math.max(shakeAmt,6*str);
}
function doHit(b,t,p,w){
  const cfg=G.cfg;
  let base=p.base, label=partN(p);
  if(cfg.core && p.id===G.coreId){ base*=3; label=T('核心×3','Core x3'); }
  G.hits++; G.combo++; G.maxCombo=Math.max(G.maxCombo,G.combo);
  const cap=cfg.comboBoost?15:10, step=cfg.comboBoost?.2:.1;
  const mult=1+Math.min(G.combo-1,cap)*step;
  const pts=Math.round(base*mult*b.prop.mult*cfg.mult);
  G.score+=pts; t.lastHit=G.clock;
  const big = p.id==='core' || (cfg.core&&p.id===G.coreId) || p.id==='head';
  impact(t,b.x,b.y,big?1:.75,p);
  if(G.combo>=5) t.dizzy=1.3;
  addText(b.x,b.y-U*.15,label+' +'+pts, big?'#ffd27a':'#fff', big?26:22);
  if(G.combo>=2) addText(b.x,b.y-U*.15-26,G.combo+T(' 連擊!',' combo!'),'#ff9a3d',18);
  burst(b.x,b.y,big?22:12,big?1.1:.8);
  if(p.id==='core'||(cfg.core&&p.id===G.coreId)){ SFX.bull(); if(!S.settings.calm){ flashA=.28; flashX=b.x; flashY=b.y; } vib(25); }
  else { SFX.hit(G.combo); vib(14); }
  if(big || G.combo>=5){ slowT=S.settings.calm?0:.22; }
  if(cfg.overtime){ G.time+=1.5; addText(W/2,H*.2,T('+1.5 秒','+1.5s'),'#9fd2ff',20); }
  if(G.combo%5===0 && G.mode!=='punch'){ G.ammo++; addText(W/2,H*.3,T('補給 道具 +1','Supply +1 item'),'#9fffc8',22); }
  // 排隊清空
  if(cfg.queue && G.targets.every(x=>G.clock-x.lastHit<=7)){
    G.score+=150; addText(W/2,H*.28,T('清空隊伍 +150','Queue cleared +150'),'#ffd27a',26); burst(W/2,H*.4,30,1.2); SFX.bull();
    G.targets.forEach(x=>x.lastHit=-99);
  }
  // 球彈開
  b.state='bounce'; b.vx=(b.x-t.x)*2.2+rand(-60,60); b.vy=-300; b.life=1;
  if(!G.gotGoal && G.score>=G.cfg.goal){ G.gotGoal=true; addText(W/2,H*.5,T('達標！','Goal reached!'),'#9fffc8',34); $('#s1').classList.add('got'); }
  updHUD(); 
}
function missBall(b,why){
  G.combo=0; SFX.miss();
  addText(b.x,b.y-10,why||T('沒中','Miss'),'#cfc3ff',20);
  b.state='bounce'; b.vx=rand(-60,60); b.vy=-120; b.life=.9; updHUD();
}
function resolveBall(b){
  const br=ballR(b.prop,1)*b.prop.hit;
  let found=null;
  for(const t of G.targets){
    for(const p of PARTS){
      const w=pw(t,p);
      if(Math.hypot(b.x-w.x,b.y-w.y)<w.r+br){ found={t,p,w}; break; }
    }
    if(found) break;
  }
  if(!found){ missBall(b); return; }
  if(G.cfg.ghost && found.t.alpha<.45){ missBall(b,T('穿過去了…','Passed through…')); return; }
  if(G.cfg.shield && G.shieldAmt>.5 && LOWER[found.p.id]){ missBall(b,T('被簡報擋住！','Blocked by the slide!')); return; }
  doHit(b,found.t,found.p,found.w);
}
const SLAP_ZH=['啪！','啪啪！','巴掌！'], SLAP_EN=['SLAP!','SMACK!','WHAP!'];
function addSlap(x,y,t){
  const side=x<t.x?1:-1;
  slapfx.push({x,y,life:.24,max:.24,side,rot:side*rand(.2,.5)});
  if(slapfx.length>8) slapfx.shift();
}
function addBump(t){
  const a=rand(0,TAU), d=Math.sqrt(Math.random())*.8;
  t.bumps.push({x:Math.cos(a)*d*.3, y:-.68+Math.sin(a)*d*.28, r:rand(.05,.085), born:time, hue:Math.random()<.3?1:0});
}
function doPunch(t,p,x,y){
  if(!G||G.state!=='play') return;
  const pm=G.mode==='punch';
  let pts=2;
  if(pm){
    G.hits++; G.combo++; G.maxCombo=Math.max(G.maxCombo,G.combo); G.punchLast=G.clock;
    pts=Math.round(8*(1+Math.min(G.combo-1,15)*.1));
    G.score+=pts; t.slaps++;
    if(t.bumps.length<16 && (t.slaps%3===1 || Math.random()<.25)) addBump(t);
    if(G.combo%10===0) addText(W/2,H*.3,G.combo+T(' 連拍！',' slap combo!'),'#ff9a3d',28);
  } else G.score+=pts;
  impact(t,x,y,pm?.7:.55,p); addSlap(x,y,t); burst(x,y,6,.6);
  if(!pm || t.slaps%2===0){ const w=S.lang==='en'?SLAP_EN:SLAP_ZH; addText(x+rand(-20,20),y-U*.3,w[(Math.random()*w.length)|0],'#ffb04a',pm?30:24); }
  addText(x,y-U*.1,'+'+pts,'#fff',18);
  SFX.punch(); vib(8); updHUD();
}
function targetAt(x,y){
  if(!G && !demoT) return null;
  const arr=G?G.targets:[demoT];
  for(const t of arr){
    if(G&&G.cfg.ghost&&t.alpha<.45) continue;
    for(const p of PARTS){
      const w=pw(t,p);
      if(Math.hypot(x-w.x,y-w.y)<w.r+6) return {t,p};
    }
  }
  return null;
}

cv.addEventListener('pointerdown',e=>{

function endPtr(e,cancel){

    const pl=plan(ptr.x-ptr.sx,ptr.y-ptr.sy);

    else if(Math.hypot(ptr.x-ptr.sx,ptr.y-ptr.sy)>12){ const m=T('往下拉久一點，再放開！','Pull down a bit more, then release!'); $('#tip').textContent=m; setTimeout(()=>{ if($('#tip').textContent===m) $('#tip').textContent=''; },1500); }
  }

}

function updTargets(dt,sd){
  const cfg=G?G.cfg:DEMO_CFG, arr=G?G.targets:[demoT], n=arr.length;
  arr.forEach((t,i)=>{
    const pmode=!!(G&&G.mode==='punch');
    t.size=(G?1:.8)*cfg.size*(pmode?.85:1);
    const bx = n===3 ? W/2+(i-1)*W*.29 : W/2, by = n===3 ? H*.46 : (pmode?H*.52:(G?H*.42:H*.4));
    t.swell+=((1-Math.exp(-t.slaps/55))-t.swell)*Math.min(1,sd*10); t.hs=1+.8*t.swell;
    { const warn=!!(G&&G.ctrs&&G.ctrs.some(c=>c.state==='warn'&&c.th===t)); t.wind+=((warn?1:0)-t.wind)*Math.min(1,sd*14); }
    if(G&&G.state!=='pause'&&cfg.dodge&&G.state==='play'){
      t.dodgeT-=sd;
      if(t.dodgeT<=0){
        t.dodgeT=rand(1.5,2.6); const lim=W*.2; let nv; let guard=0;
        do{ nv=rand(-lim,lim); guard++; }while(Math.abs(nv-t.dxT)<W*.15&&guard<10);
        t.dxT=nv;
      }
    }
    t.dx+=(t.dxT-t.dx)*Math.min(1,sd*9);
    const sway = G && G.state==='intro' ? .4 : 1;
    t.x=clamp(bx+Math.sin(time*cfg.sp*1.3+t.ph)*cfg.ax*W*sway+t.dx, U*.7, W-U*(cfg.st.acc==='pan'?1.05:.7));
    t.y=by+Math.sin(time*1.7+t.ph)*U*.02;
    // 彈簧
    t.sxV+=(-150*(t.sx-1)-9*t.sxV)*sd; t.sx+=t.sxV*sd;
    t.syV+=(-150*(t.sy-1)-9*t.syV)*sd; t.sy+=t.syV*sd;
    t.rotV+=(-95*t.rot-6*t.rotV)*sd; t.rot+=t.rotV*sd;
    t.kxV+=(-90*t.kx-7*t.kxV)*sd; t.kx+=t.kxV*sd;
    t.hopV+=1500*sd*(U/120); t.hop+=t.hopV*sd; if(t.hop>0){ t.hop=0; t.hopV=0; }
    t.hurt=Math.max(0,t.hurt-sd); t.dizzy=Math.max(0,t.dizzy-sd);
    t.dents.forEach(d=>d.life-=sd); t.dents=t.dents.filter(d=>d.life>0);
    // 視線
    const tgt = ptr&&ptr.mode==='aim' ? {x:SX,y:SY} : {x:SX,y:SY};
    const dxl=tgt.x-t.x, dyl=tgt.y-t.y, dl=Math.hypot(dxl,dyl)||1; t.look.x=dxl/dl; t.look.y=dyl/dl;

const CTR_EMOJI={boss:'💼',clock:'⏰',headset:'📊',crown:'📣',hourglass:'⌛',ghost:'💬',ticket:'🎫',robot:'🔩',boss2:'☄️'};
function startCounter(){
  const vis=G.targets.filter(t=>!(G.cfg.ghost&&t.alpha<.5));
  if(!vis.length) return false;
  const th=vis[(Math.random()*vis.length)|0];
  G.ctrs.push({state:'warn',w:.5,th,t:0,T:G.cfg.ctrT,type:G.cfg.st.acc,spin:0,vs:rand(-8,8),x:th.x,y:th.y,r:0,life:0,vx:0,vy:0,sx0:0,sy0:0,ex:SX+rand(-.2,.2)*W,ey:H*.7});

  return true;
}
function updCounter(c,sd){
  const th=c.th, sz=U*th.size;
  if(c.state==='warn'){
    c.w-=sd; c.x=th.x+sz*.7; c.y=th.y;
    if(c.w<=0){ c.state='fly'; c.t=0; c.sx0=th.x+sz*.7; c.sy0=th.y-sz*.1; th.sx=.88; th.sy=1.14; th.hopV=-150*(U/120); th.rotV+=-2; SFX.throw(); }
  } else if(c.state==='fly'){
    c.t+=sd/c.T; c.spin+=c.vs*sd;
    const k=Math.min(c.t,1);
    c.x=lerp(c.sx0,c.ex,k); c.y=lerp(c.sy0,c.ey,k)-Math.sin(Math.PI*k)*H*.08;
    c.r=U*.28*(c.type==='pan'?1.3:1)*lerp(.35,1.8,Math.pow(k,1.3));

function update(dt){
  time+=dt;
  if(!demoT) demoT=makeTarget(0);
  if(G && G.state==='pause') return;
  const sd=dt*(slowT>0?.3:1); if(slowT>0) slowT-=dt;
  if(G){
    if(G.state==='play'){
      G.clock+=sd; G.cool-=dt;
      G.time-=dt;
      if(G.time<=0){ G.time=0; endGame(); }
      if(G.cfg.shield){ const on=(G.clock%5)>2.8; G.shieldAmt+=((on?1:0)-G.shieldAmt)*Math.min(1,sd*6); }
      if(G.cfg.core){ G.coreT-=sd; if(G.coreT<=0){ G.coreT=2.2; const ids=['head','belly','armL','armR'].filter(i=>i!==G.coreId); G.coreId=ids[(Math.random()*ids.length)|0]; } }
      if(G.cfg.ctrEvery>0 && G.clock>4){
        G.ctrT-=sd;
        if(G.ctrT<=0){ G.ctrT=G.cfg.ctrEvery*rand(.7,1.3); if(Math.random()<G.cfg.ctrP) G.ctrPending=1+Math.floor(Math.random()*G.cfg.ctrBurst); }
      }
      if(G.ctrPending>0){ G.ctrDelay-=sd; if(G.ctrDelay<=0){ if(startCounter()){ G.ctrPending--; G.ctrDelay=.9; } else G.ctrDelay=.4; } }
      if(G.mode==='punch' && G.combo>0 && G.clock-(G.punchLast||0)>1.2){ G.combo=0; updHUD(); }
      if(ptr&&ptr.mode==='punch'){
        ptr.cd-=dt;
        if(ptr.cd<=0){ const h=targetAt(ptr.x,ptr.y); if(h){ doPunch(h.t,h.p,ptr.x,ptr.y); ptr.cd=G.mode==='punch'?.14:.3; } else ptr.cd=.1; }
      }
      if(G.mode!=='punch' && G.ammo<=0 && !G.balls.some(b=>b.state==='fly')){
        G.endT+=dt; if(G.endT>.9) endGame();
      } else G.endT=0;
    } else if(G.state==='intro'){ G.clock+=sd*.3; }
    // 球
    for(const b of G.balls){
      if(b.state==='fly'){
        b.t+=sd/b.T; b.spin+=b.vs*sd;
        const p=ballPos(b.pl,Math.min(b.t,1)); b.x=p.x; b.y=p.y;
        if(b.t>=1 && G.state!=='end'){ b.x=b.pl.A.x; b.y=b.pl.A.y; resolveBall(b); }
        else if(b.t>=1){ b.state='bounce'; b.vx=0; b.vy=-100; b.life=.5; }
      } else {
        b.vy+=900*sd; b.x+=b.vx*sd; b.y+=b.vy*sd; b.spin+=b.vs*sd; b.life-=sd;
      }
    }
    G.balls=G.balls.filter(b=>b.life<=0&&b.state==='bounce'?false:true);
    for(const c of G.ctrs) updCounter(c,sd);
    G.ctrs=G.ctrs.filter(c=>c.state!=='done');
  }
  updTargets(dt,sd);
  // 粒子 / 文字 / 特效
  for(const p of parts){ p.vy+=700*sd; p.x+=p.vx*sd; p.y+=p.vy*sd; p.rot+=p.vr*sd; p.life-=sd; }
  for(let i=parts.length-1;i>=0;i--) if(parts[i].life<=0) parts.splice(i,1);
  for(const t of texts){ t.y-=40*sd; t.life-=sd; }
  for(let i=texts.length-1;i>=0;i--) if(texts[i].life<=0) texts.splice(i,1);
  for(const f of fxl) f.life-=sd;
  for(let i=fxl.length-1;i>=0;i--) if(fxl[i].life<=0) fxl.splice(i,1);
  for(const f of slapfx) f.life-=sd;
  for(let i=slapfx.length-1;i>=0;i--) if(slapfx[i].life<=0) slapfx.splice(i,1);
  shakeAmt*=Math.pow(.001,dt); if(shakeAmt<.2) shakeAmt=0;
  flashA=Math.max(0,flashA-dt*1.6);
  if(G && G.state!=='end') updHUD();
}

function drawPalm(c,x,y,sc,rot,flip,alpha){
  const R=U*.42;
  c.save(); c.translate(x,y); c.rotate(rot); c.scale(flip*sc,sc); c.globalAlpha=alpha; c.lineJoin='round';
  const sh=[[0,R*.15,R*.62,R*.7,0],[-R*.42,-R*.75,R*.15,R*.5,-.12],[-R*.14,-R*.95,R*.15,R*.58,-.03],[R*.14,-R*.92,R*.15,R*.56,.04],[R*.4,-R*.7,R*.14,R*.45,.14],[-R*.78,R*.12,R*.15,R*.38,-1.0]];
  c.strokeStyle='#8f4529'; c.lineWidth=R*.14;
  for(const e of sh){ c.beginPath(); c.ellipse(e[0],e[1],e[2],e[3],e[4],0,TAU); c.stroke(); }
  const g=c.createLinearGradient(-R,-R,R,R); g.addColorStop(0,'#ffe3c6'); g.addColorStop(1,'#f4b88a'); c.fillStyle=g;
  for(const e of sh){ c.beginPath(); c.ellipse(e[0],e[1],e[2],e[3],e[4],0,TAU); c.fill(); }
  c.strokeStyle='rgba(143,69,41,.45)'; c.lineWidth=R*.05; c.beginPath(); c.moveTo(-R*.3,R*.1); c.quadraticCurveTo(0,R*.35,R*.3,R*.05); c.stroke();
  c.restore();
}
function drawBall(c,x,y,r,prop,spin,alpha){

      c.beginPath(); c.arc(-r*.2,0,r*.55,.3,2.4); c.moveTo(r*.1,-r*.7); c.lineTo(r*.35,-r*.1); c.lineTo(r*.0,r*.5); c.stroke(); break;
    case 'foam': sphere('#ffc27a','#e0680a'); c.fillStyle='rgba(255,255,255,.45)'; c.beginPath(); c.ellipse(-r*.35,-r*.4,r*.25,r*.15,-.6,0,TAU); c.fill(); break;

      c.fillStyle='#ff6f91'; c.beginPath(); c.moveTo(0,r*.3); c.bezierCurveTo(-r*.55,-r*.1,-r*.25,-r*.5,0,-r*.2); c.bezierCurveTo(r*.25,-r*.5,r*.55,-r*.1,0,r*.3); c.fill(); break; }
    case 'yarn': sphere('#ffb3cf','#d6407c'); c.strokeStyle='rgba(255,255,255,.55)'; c.lineWidth=Math.max(1,r*.09);
      for(let i=-1;i<=1;i++){ c.beginPath(); c.arc(0,i*r*.1,r*(.55+Math.abs(i)*.1),.4+i*.3,2.6+i*.3); c.stroke(); } break;
    case 'star': c.fillStyle='#ffd86b'; c.strokeStyle='#b98d3e'; c.lineWidth=Math.max(1,r*.08); starPath(c,0,0,r*1.15,0); c.fill(); c.stroke();
      c.fillStyle='rgba(255,255,255,.5)'; c.beginPath(); c.ellipse(-r*.2,-r*.35,r*.2,r*.12,-.6,0,TAU); c.fill(); break;

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);

  for(let i=0;i<4;i++){

    const g=ctx.createRadialGradient(x,0,0,x,0,H*.22); g.addColorStop(0,'rgba(255,210,140,'+a+')'); g.addColorStop(1,'rgba(255,210,140,0)');
    ctx.fillStyle=g; ctx.fillRect(x-H*.22,0,H*.44,H*.22);
  }
  const arr=G?G.targets:(demoT?[demoT]:[]), cfg=G?G.cfg:DEMO_CFG;

    const k=1-sp.life/sp.max, sc=lerp(1.6,1,Math.min(1,k/.35)), a=k<.55?.95:.95*(1-(k-.55)/.45);
    drawPalm(ctx,sp.x+sp.side*U*.05,sp.y,sc,sp.rot,sp.side,Math.max(0,a));
  }
  if(G) for(const c of G.ctrs){
    if(c.state==='warn'){
      const th=c.th, pul=1+.15*Math.sin(time*25);
      ctx.save(); ctx.translate(th.x,th.y-U*th.size*1.45); ctx.scale(pul,pul);
      ctx.fillStyle='#ff3b3b'; ctx.strokeStyle='#fff6e4'; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(0,0,U*.15,0,TAU); ctx.fill(); ctx.stroke();
      utext(ctx,'!',0,U*.01,U*.2,'#fff'); ctx.restore();
    } else if(c.state==='splat'){
      ctx.save(); ctx.globalAlpha=clamp(c.life/.3,0,1); ctx.font=(U*.9)+'px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('💥',c.x,c.y); ctx.restore();
    } else {
      ctx.save(); ctx.translate(c.x,c.y);
      if(c.state==='fly'){ ctx.strokeStyle='rgba(255,122,122,.75)'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(0,0,c.r*1.35,0,TAU); ctx.stroke(); }
      ctx.rotate(c.spin); ctx.globalAlpha=c.state==='swat'?clamp(c.life/.4,0,1):1;
      ctx.shadowColor='rgba(255,255,255,.55)'; ctx.shadowBlur=10;

      else { ctx.font=(c.r*2)+'px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(CTR_EMOJI[c.type]||'💢',0,0); }
      ctx.restore();
    }
  }
  // 瞄準
  if(G && G.state==='play' && ptr && ptr.mode==='aim'){
    const pl=plan(ptr.x-ptr.sx,ptr.y-ptr.sy), pr=G.prop;
    const L=H*.2; let dx=ptr.x-ptr.sx, dy=ptr.y-ptr.sy, len=Math.hypot(dx,dy); if(len>L){ dx*=L/len; dy*=L/len; }
    ctx.strokeStyle='rgba(244,217,160,.8)'; ctx.lineWidth=4; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(SX-24,SY); ctx.lineTo(SX+dx*.7,SY+dy*.7); ctx.lineTo(SX+24,SY); ctx.stroke();
    if(pl.ok){
      for(let k=1;k<=9;k++){ const t=k/10, p=ballPos(pl,t); ctx.fillStyle='rgba(255,246,228,'+(.9-.5*t)+')'; ctx.beginPath(); ctx.arc(p.x,p.y,5-2.5*t,0,TAU); ctx.fill(); }
      ctx.save(); ctx.strokeStyle='#ffd27a'; ctx.lineWidth=3; ctx.shadowColor='#ff8a1f'; ctx.shadowBlur=8;
      const rr_=ballR(pr,1)*pr.hit+6; ctx.beginPath(); ctx.arc(pl.A.x,pl.A.y,rr_,0,TAU); ctx.moveTo(pl.A.x-rr_-5,pl.A.y); ctx.lineTo(pl.A.x+rr_+5,pl.A.y); ctx.moveTo(pl.A.x,pl.A.y-rr_-5); ctx.lineTo(pl.A.x,pl.A.y+rr_+5); ctx.stroke(); ctx.restore();
    }
    drawBall(ctx,SX+dx*.6,SY+dy*.6,ballR(pr,0),pr,0);

  }

  if(G) for(const b of G.balls){
    const t=b.state==='fly'?Math.min(b.t,1):1;
    const r=b.state==='fly'?ballR(b.prop,t):ballR(b.prop,1);

  for(const f of fxl){

    ctx.restore();
  }

  for(const p of parts){

    if(p.type==='star'){ starPath(ctx,0,0,p.size,0); ctx.fill(); }

    else { ctx.beginPath(); ctx.arc(0,0,p.size/2.2,0,TAU); ctx.fill(); }
    ctx.restore();
  }
  // 浮動文字
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.lineJoin='round';
  for(const t of texts){

  ctx.restore();
}

    const ds=document.createElement('div'); ds.className='ds'; ds.textContent=propD(p);
    const b=document.createElement('button'); b.className='btn small '+(S.prop===p.id?'gd':own?'bl':'or'); 
    b.textContent = S.prop===p.id ? T('使用中','In use') : own ? T('使用','Use') : '🪙 '+p.price;
    b.addEventListener('click',()=>{
      if(own){ S.prop=p.id; save(); SFX.click(); buildColl(); return; }
      if(S.coins>=p.price){ S.coins-=p.price; S.props.push(p.id); S.prop=p.id; save(); SFX.buy(); toast(T('解鎖了「'+propN(p)+'」！','Unlocked '+propN(p)+'!')); buildColl(); }
      else toast(T('遊戲幣不夠，還差 '+(p.price-S.coins)+' 個','Not enough coins, need '+(p.price-S.coins)+' more'));
    });
    d.append(e,n,ds,b); box.appendChild(d);
  });
  const bb=$('#cBadges'); bb.textContent='';
  LEVELS.forEach((l,i)=>{
    const own=S.badges.includes(i), d=document.createElement('div'); d.className='item'+(own?'':' lock');
    const e=document.createElement('div'); e.className='em'; e.textContent=own?l.e:'❔';
    const n=document.createElement('div'); n.className='nm'; n.textContent=own?lvN(l):'???';
    d.append(e,n); bb.appendChild(d);
  });
}
function buildSetup(){
  $('#iName').value=S.name; $('#iOpp').value=S.opp;
  const oc=$('#oppChips'); oc.textContent='';
  OPP_PRESETS.forEach((p,pi)=>{ const lab=S.lang==='en'?OPP_EN[pi]:p; const b=document.createElement('button'); b.className='cp'; b.textContent=lab; b.addEventListener('click',()=>{ $('#iOpp').value=lab; SFX.click(); }); oc.appendChild(b); });
  const mc=$('#modeChips'); mc.textContent=''; setup.mode=S.mode; setup.prop=S.prop;
  MODES.forEach(m=>{ const b=document.createElement('button'); b.className='cp'+(setup.mode===m.id?' sel':''); b.textContent=modeN(m);
    b.addEventListener('click',()=>{ setup.mode=m.id; SFX.click(); mc.querySelectorAll('.cp').forEach(x=>x.classList.toggle('sel',x===b)); }); mc.appendChild(b); });
  const pc=$('#propChips'); pc.textContent='';
  PROPS.filter(p=>S.props.includes(p.id)).forEach(p=>{ const b=document.createElement('button'); b.className='cp'+(setup.prop===p.id?' sel':''); b.textContent=p.e+' '+propN(p);
    b.addEventListener('click',()=>{ setup.prop=p.id; SFX.click(); pc.querySelectorAll('.cp').forEach(x=>x.classList.toggle('sel',x===b)); }); pc.appendChild(b); });
}
const setup={mode:'level',prop:'paper'};
function saveSetup(){
  S.name=$('#iName').value.trim().slice(0,10);
  S.opp=$('#iOpp').value.trim().slice(0,12);
  S.mode=setup.mode; S.prop=setup.prop; S.setupDone=true; save();
}
function buildSettings(){
  const set=(id,k)=>{ $(id).classList.toggle('on',!!S.settings[k]); };
  set('#tgSound','sound'); set('#tgVib','vibrate'); set('#tgCalm','calm');
  resetArmed=false; $('#bReset').textContent=T('清除','Clear'); $('#resetHint').textContent=T('只會清除這支手機瀏覽器中的紀錄。','Only clears records stored in this phone browser.');
}
let resetArmed=false;
function quickStart(){
  SFX.click();
  if(!S.setupDone){ go('setup'); toast(T('先取個暱稱和虛構對手吧（也可以直接按儲存）','Pick a nickname and a fictional rival (or just tap Save)')); return; }
  if(S.mode==='daily') startGame('daily',dailyLevel());
  else if(S.mode==='punch') startGame('punch',0);
  else startGame('level',Math.min(S.lastLevel,S.unlocked-1));
}
function shareText(){
  const g=G&&G.res; if(!g) return '';
  return T('我在《怨氣俱樂部》拿到 '+g.total+' 分（'+stars(g.stars)+'），段位「'+rankN(rankIdx(S.xp))+'」！最高 '+G.maxCombo+' 連擊。','I scored '+g.total+' ('+stars(g.stars)+') in GRUDGE CLUB! Rank: '+rankN(rankIdx(S.xp))+', best combo '+G.maxCombo+'.');
}

function applyLang(){
  const en=S.lang==='en';
  document.documentElement.lang=en?'en':'zh-Hant';
  document.title=en?'GRUDGE CLUB':'怨氣俱樂部 GRUDGE CLUB';
  for(const [sel,zh,e,html] of STATIC){ document.querySelectorAll(sel).forEach(el=>{ if(html) el.innerHTML=en?e:zh; else el.textContent=en?e:zh; }); }
  document.querySelectorAll('.back').forEach(b=>b.textContent=en?'← Back':'← 返回');
  $('#iName').placeholder=en?'Anonymous':'匿名玩家';
  $('#iOpp').placeholder=en?'Blank = level default rival':'留空＝使用關卡預設對手';
  $('#logo').textContent=en?'GRUDGE CLUB':'怨氣俱樂部';
  $('#logoSub').textContent=en?'怨氣俱樂部':'GRUDGE CLUB';
  $('#brand').classList.toggle('en',en);
  $('#bLang').textContent=en?'中文':'EN';
  $('#bPause').setAttribute('aria-label',en?'Pause':'暫停'); $('#bRestart').setAttribute('aria-label',en?'Restart':'重新開始');
  refreshHome();
}
let brandT=0;
function brandIntro(){
  const b=$('#brand'); b.classList.remove('mini'); clearTimeout(brandT);
  brandT=setTimeout(()=>b.classList.add('mini'),1000);
}
$('#bLang').addEventListener('click',()=>{ S.lang=S.lang==='en'?'zh':'en'; save(); SFX.click(); applyLang(); brandIntro(); });

$('#bLevels').addEventListener('click',()=>go('levels'));
$('#bColl').addEventListener('click',()=>go('coll'));
$('#bSet').addEventListener('click',()=>go('settings'));
$('#bSetupGo').addEventListener('click',()=>{ saveSetup(); quickStart(); });
$('#bGo').addEventListener('click',beginPlay);
$('#bInBack').addEventListener('click',()=>{ SFX.click(); leaveGame(); });
$('#bPause').addEventListener('click',()=>{ SFX.click(); pauseGame(); });
$('#bResume').addEventListener('click',()=>{ SFX.click(); resumeGame(); });
$('#bRestart').addEventListener('click',()=>{ if(!G) return; SFX.click(); startGame(G.mode,G.lv); });

$('#propb').addEventListener('click',()=>{
  if(!G||G.mode==='punch') return;
  const owned=PROPS.filter(p=>S.props.includes(p.id)); const i=owned.findIndex(p=>p.id===G.prop.id);
  G.prop=owned[(i+1)%owned.length]; $('#propb').textContent=G.prop.e; SFX.click(); addText(W/2,SY-U*.7,propN(G.prop),'#fff',20);
});
$('#bAgain').addEventListener('click',()=>{ if(!G) return; $('#result').classList.remove('on'); SFX.click(); startGame(G.mode,G.lv); });
$('#bNext').addEventListener('click',()=>{ if(!G) return; const nl=G.lv+1; $('#result').classList.remove('on'); SFX.click(); startGame('level',nl); });
$('#bRHome').addEventListener('click',()=>{ SFX.click(); leaveGame(); });
$('#bShare').addEventListener('click',async()=>{
  const txt=shareText(); if(!txt) return; SFX.click();
  try{
    if(navigator.share){ await navigator.share({text:txt}); return; }
  }catch(e){ if(e&&e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(txt); toast(T('成績已複製，可以貼到任何地方','Score copied. Paste it anywhere!')); }
  catch(e){ toast(txt); }
});
function tg(id,k){ $(id).addEventListener('click',()=>{ S.settings[k]=!S.settings[k]; save(); buildSettings(); SFX.click(); }); }
tg('#tgSound','sound'); tg('#tgVib','vibrate'); tg('#tgCalm','calm');
$('#bReset').addEventListener('click',()=>{
  if(!resetArmed){ resetArmed=true; $('#bReset').textContent=T('再按一次確認','Tap again to confirm'); $('#resetHint').textContent=T('這會清除暱稱、分數、遊戲幣、段位和收藏，無法復原。','This erases your nickname, scores, coins, rank and collection. It cannot be undone.'); return; }
  { const lg=S.lang; S=defaults(); S.lang=lg; } ensureDaily(); save(); resetArmed=false; buildSettings(); toast(T('已清除所有遊戲資料','All game data cleared')); refreshHome();
});

let prevT=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-prevT)/1000); prevT=now;
  try{ update(dt); render(); }catch(e){ console.error(e); }
  requestAnimationFrame(frame);
}

window.addEventListener('orientationchange',()=>setTimeout(resize,200));
resize(); applyLang(); brandIntro(); if(!storageOK) $('#hWarn').textContent=warnTxt();
requestAnimationFrame(frame);
